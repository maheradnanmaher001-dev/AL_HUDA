name: Install AL-HUDA Step 10 Universal Search
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Step 10
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -iname 'AL-HUDA_step10_universal_search.zip' | head -n1)
          test -n "$ZIP"
          mkdir .step10
          unzip -oq "$ZIP" -d .step10
          cp -R .step10/. .
          rm -rf .step10 "$ZIP"
      - name: Commit Step 10
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Add AL-HUDA Step 10 Universal Search" && git push)
