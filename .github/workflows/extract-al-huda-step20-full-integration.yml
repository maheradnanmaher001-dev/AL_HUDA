name: Step 20 - Full Integration and Android Testing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  step20:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate Step 20 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'AL_HUDA_STEP20_FULL_INTEGRATION_ANDROID_TESTING.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::AL_HUDA_STEP20_FULL_INTEGRATION_ANDROID_TESTING.zip was not found in repository root."
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Step 20 package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .step20_package
          mkdir -p .step20_package
          unzip -q "$ZIP_FILE" -d .step20_package
          test -f .step20_package/main.py
          test -f .step20_package/al_huda.kv
          test -f .step20_package/buildozer.spec
          test -f .step20_package/tools/verify_step20.py
          test -f .step20_package/STEP20_INTEGRATION_TESTING.md

          cp -f .step20_package/main.py main.py
          cp -f .step20_package/al_huda.kv al_huda.kv
          cp -f .step20_package/buildozer.spec buildozer.spec
          cp -f .step20_package/requirements.txt requirements.txt
          cp -f .step20_package/README.md README.md
          cp -f .step20_package/ANIMATIONS.md ANIMATIONS.md
          cp -f .step20_package/LICENSE LICENSE
          cp -f .step20_package/.gitignore .gitignore
          cp -R .step20_package/app app/
          cp -R .step20_package/backend backend/
          cp -R .step20_package/assets assets/
          cp -R .step20_package/tests tests/
          cp -R .step20_package/tools tools/
          cp -f .step20_package/STEP18_MANIFEST.txt STEP18_MANIFEST.txt
          cp -f .step20_package/STEP20_INTEGRATION_TESTING.md STEP20_INTEGRATION_TESTING.md

      - name: Verify existing Quran and Hadith data was preserved
        shell: bash
        run: |
          set -euo pipefail
          test -d data/quran
          test -d data/hadith
          echo "PASS: existing data/quran and data/hadith directories are present."

      - name: Compile Python sources
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app backend main.py tools tests

      - name: Run Step 20 static integration audit
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_step20.py

      - name: Run Step 20 unit checks
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_step20_integration.py' -v

      - name: Verify Android build configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'requirements = python3,kivy,requests' buildozer.spec
          grep -F 'android.api = 35' buildozer.spec
          grep -F 'android.minapi = 23' buildozer.spec
          grep -F 'ACCESS_FINE_LOCATION' buildozer.spec
          grep -F 'POST_NOTIFICATIONS' buildozer.spec
          grep -F 'WAKE_LOCK' buildozer.spec
          grep -F 'FOREGROUND_SERVICE' buildozer.spec
          echo "PASS: Android configuration audit"

      - name: Commit Step 20
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ backend/ assets/ tests/ tools/ main.py al_huda.kv buildozer.spec requirements.txt README.md ANIMATIONS.md LICENSE .gitignore STEP18_MANIFEST.txt STEP20_INTEGRATION_TESTING.md
          if git diff --cached --quiet; then
            echo "No Step 20 changes to commit."
          else
            git commit -m "Complete Step 20 integration and Android audit"
            git push
          fi
