name: Install AL-HUDA Step 13 Email Verification Reset
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Step 13
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -iname 'AL-HUDA_step13_email_verification_reset.zip' | head -n1)
          test -n "$ZIP"
          mkdir .step13
          unzip -oq "$ZIP" -d .step13
          cp -R .step13/. .
          rm -rf .step13 "$ZIP"
      - name: Commit Step 13
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Add AL-HUDA Step 13 email verification and reset foundation" && git push)
