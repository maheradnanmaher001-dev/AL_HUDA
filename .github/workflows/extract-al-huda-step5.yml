name: Install AL-HUDA Step 5 Qibla
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Step 5
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -iname 'AL-HUDA_step5_qibla_update.zip' | head -n1)
          test -n "$ZIP"
          mkdir .step5
          unzip -oq "$ZIP" -d .step5
          cp -R .step5/. .
          rm -rf .step5 "$ZIP"
      - name: Commit Step 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Add AL-HUDA Step 5 live Qibla compass" && git push)
