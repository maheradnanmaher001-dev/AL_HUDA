name: Install AL-HUDA Step 4 Prayer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Step 4
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -iname 'AL-HUDA_step4_prayer_update.zip' | head -n 1)
          test -n "$ZIP"
          mkdir .step4
          unzip -oq "$ZIP" -d .step4
          cp -R .step4/. .
          rm -rf .step4 "$ZIP"
      - name: Commit Step 4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Add AL-HUDA Step 4 prayer times" && git push)
