name: Install AL-HUDA Step 3 Hadith
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Step 3
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -iname 'AL-HUDA_step3_hadith_update.zip' | head -n1)
          test -n "$ZIP"
          mkdir .step3
          unzip -oq "$ZIP" -d .step3
          cp -R .step3/. .
          rm -rf .step3 "$ZIP"
      - name: Commit Step 3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Add AL-HUDA Step 3 Hadith module" && git push)
