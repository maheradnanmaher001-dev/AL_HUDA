name: Install AL-HUDA Step 12 Login Register
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Step 12
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -iname 'AL-HUDA_step12_login_register.zip' | head -n1)
          test -n "$ZIP"
          mkdir .step12
          unzip -oq "$ZIP" -d .step12
          cp -R .step12/. .
          rm -rf .step12 "$ZIP"
      - name: Commit Step 12
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Add AL-HUDA Step 12 Login Register" && git push)
