name: Install AL-HUDA Step 9 Tasbeeh
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Step 9
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -iname 'AL-HUDA_step9_tasbeeh.zip' | head -n1)
          test -n "$ZIP"
          mkdir .step9
          unzip -oq "$ZIP" -d .step9
          cp -R .step9/. .
          rm -rf .step9 "$ZIP"
      - name: Commit Step 9
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Add AL-HUDA Step 9 Tasbeeh" && git push)
