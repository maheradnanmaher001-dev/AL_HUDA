name: Step 21 - Final APK Build (Fixed 2)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate Step 21 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'AL_HUDA_STEP21_FINAL_APK_BUILD_FIXED2.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::AL_HUDA_STEP21_FINAL_APK_BUILD_FIXED2.zip was not found in repository root."
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Step 21 package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .step21_package
          mkdir -p .step21_package
          unzip -q "$ZIP_FILE" -d .step21_package
          test -f .step21_package/buildozer.spec
          test -f .step21_package/main.py
          test -f .step21_package/al_huda.kv
          test -f .step21_package/assets/icon.png
          test -f .step21_package/assets/splash.png
          test -f .step21_package/tools_step21_preflight.py
          cp -Rf .step21_package/app/. app/
          cp -Rf .step21_package/backend/. backend/
          cp -Rf .step21_package/assets/. assets/
          cp -Rf .step21_package/tests/. tests/
          cp -f .step21_package/main.py main.py
          cp -f .step21_package/al_huda.kv al_huda.kv
          cp -f .step21_package/buildozer.spec buildozer.spec
          cp -f .step21_package/requirements.txt requirements.txt
          cp -f .step21_package/README.md README.md
          cp -f .step21_package/STEP18_MANIFEST.txt STEP18_MANIFEST.txt
          cp -f .step21_package/STEP20_INTEGRATION_TESTING.md STEP20_INTEGRATION_TESTING.md
          cp -f .step21_package/tools_step21_preflight.py tools_step21_preflight.py

      - name: Verify existing Quran and Hadith data is preserved
        shell: bash
        run: |
          set -euo pipefail
          test -d data/quran
          test -d data/hadith
          echo "PASS: existing Quran/Hadith data directories are present."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'buildozer>=1.5.0' 'cython==0.29.37'

      - name: Verify SDK license automation is enabled
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^android\.accept_sdk_license[[:space:]]*=[[:space:]]*True[[:space:]]*$' buildozer.spec
          echo 'PASS: Buildozer will automatically accept Android SDK licenses.'

      - name: Run Step 21 preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools_step21_preflight.py
          python -m compileall -q app backend main.py tests tools_step21_preflight.py

      - name: Build Android debug APK
        shell: bash
        env:
          BUILDOZER_ALLOW_ORG_TEST_DOMAIN: '1'
        run: |
          set -euo pipefail
          buildozer -v android debug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo '::error::No APK was produced in bin/.'
            exit 1
          fi
          echo "Built APK: $APK"
          ls -lh "$APK"
          unzip -t "$APK" >/dev/null
          echo 'PASS: APK exists and archive integrity is valid.'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AL-HUDA-Test-APK-Step21
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
