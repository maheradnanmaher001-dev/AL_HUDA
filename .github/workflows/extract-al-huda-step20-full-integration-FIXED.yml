name: Step 20 - Full Integration and Android Testing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  step20:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate Step 20 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'AL_HUDA_STEP20_FULL_INTEGRATION_ANDROID_TESTING_FIXED.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Fixed Step 20 ZIP was not found in repository root."
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Step 20 package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .step20_package
          mkdir -p .step20_package
          unzip -q "$ZIP_FILE" -d .step20_package

          test -f .step20_package/main.py
          test -f .step20_package/al_huda.kv
          test -f .step20_package/buildozer.spec
          test -f .step20_package/STEP20_INTEGRATION_TESTING.md

          cp -f .step20_package/main.py main.py
          cp -f .step20_package/al_huda.kv al_huda.kv
          cp -f .step20_package/buildozer.spec buildozer.spec
          cp -f .step20_package/requirements.txt requirements.txt
          cp -f .step20_package/README.md README.md
          cp -f .step20_package/ANIMATIONS.md ANIMATIONS.md
          cp -f .step20_package/LICENSE LICENSE
          cp -f .step20_package/.gitignore .gitignore
          cp -R .step20_package/app/. app/
          cp -R .step20_package/backend/. backend/
          cp -R .step20_package/assets/. assets/
          cp -R .step20_package/tests/. tests/
          cp -f .step20_package/STEP18_MANIFEST.txt STEP18_MANIFEST.txt
          cp -f .step20_package/STEP20_INTEGRATION_TESTING.md STEP20_INTEGRATION_TESTING.md

      - name: Verify existing Quran and Hadith data was preserved
        shell: bash
        run: |
          set -euo pipefail
          test -d data/quran
          test -d data/hadith
          echo "PASS: existing data/quran and data/hadith directories are present."

      - name: Compile Python sources
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app backend main.py tests

      - name: Run Step 20 static integration audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def require_file(path):
              assert Path(path).is_file(), f"Missing required file: {path}"

          required = [
              "main.py", "al_huda.kv", "buildozer.spec", "requirements.txt",
              "app/database.py", "app/theme.py", "app/utils/responsive.py",
              "app/services/quran_service.py", "app/services/hadith_service.py",
              "app/services/prayer.py", "app/services/qibla.py",
              "app/services/adhan.py", "STEP18_MANIFEST.txt",
              "STEP20_INTEGRATION_TESTING.md"
          ]
          for p in required:
              require_file(p)

          for p in Path(".").rglob("*.py"):
              if ".step20_package" in p.parts:
                  continue
              ast.parse(p.read_text(encoding="utf-8"), filename=str(p))

          main_py = read("main.py")
          required_screens = [
              "SplashScreen", "LoginScreen", "RegisterScreen", "VerifyScreen",
              "ForgotPasswordScreen", "ResetPasswordScreen", "HomeScreen",
              "QuranScreen", "QuranReaderScreen", "HadithScreen",
              "HadithDetailScreen", "PrayerScreen", "QiblaScreen",
              "SearchScreen", "DuaScreen", "TasbeehScreen", "CalendarScreen",
              "RamadanScreen", "BookmarksScreen", "SettingsScreen"
          ]
          for cls in required_screens:
              assert re.search(rf"\b{re.escape(cls)}\b", main_py), f"{cls} not registered"

          responsive = read("app/utils/responsive.py")
          settings = read("app/screens/settings.py")
          common = read("app/screens/common.py")
          kv = read("al_huda.kv")

          for token in [
              "MIN_TEXT_SCALE = 0.80", "MAX_TEXT_SCALE = 1.60",
              "STEP = 0.10", "def fs(", "def set_text_scale("
          ]:
              assert token in responsive, f"Responsive token missing: {token}"
          assert "set_text_scale" in settings
          assert "from app.utils.responsive import fs" in common
          assert "fs(10)" in kv

          quran = read("app/services/quran_service.py")
          for token in [
              "SURAH_COUNT = 114", "JUZ_COUNT = 30",
              "def get_surah(", "def get_juz(",
              "def get_juz_with_translations(", "def search_quran("
          ]:
              assert token in quran, f"Quran integration token missing: {token}"

          hadith = read("app/services/hadith_service.py")
          for token in ["def editions(", "def book(", "def hadith(", "def section(", "def normalize("]:
              assert token in hadith, f"Hadith integration token missing: {token}"

          buildozer = read("buildozer.spec")
          for token in [
              "requirements = python3,kivy,requests",
              "android.api = 35", "android.minapi = 23",
              "ACCESS_FINE_LOCATION", "ACCESS_COARSE_LOCATION",
              "POST_NOTIFICATIONS", "WAKE_LOCK", "FOREGROUND_SERVICE"
          ]:
              assert token in buildozer, f"Android/build config missing: {token}"

          data_quran = Path("data/quran")
          data_hadith = Path("data/hadith")
          assert data_quran.is_dir()
          assert data_hadith.is_dir()

          print("PASS: Step 20 static integration audit")
          print("PASS: no Kivy runtime import used by CI audit")
          print("PASS: Step 18 Quran/Hadith data directories preserved")
          print("PASS: Step 19 responsive/text-size integration preserved")
          print("PASS: Android Buildozer configuration audited")
          PY

      - name: Run Step 20 unit checks
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_step20_integration.py' -v

      - name: Verify Android build configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'requirements = python3,kivy,requests' buildozer.spec
          grep -F 'android.api = 35' buildozer.spec
          grep -F 'android.minapi = 23' buildozer.spec
          grep -F 'ACCESS_FINE_LOCATION' buildozer.spec
          grep -F 'POST_NOTIFICATIONS' buildozer.spec
          grep -F 'WAKE_LOCK' buildozer.spec
          grep -F 'FOREGROUND_SERVICE' buildozer.spec
          echo "PASS: Android configuration audit"

      - name: Commit Step 20
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ backend/ assets/ tests/ main.py al_huda.kv buildozer.spec requirements.txt README.md ANIMATIONS.md LICENSE .gitignore STEP18_MANIFEST.txt STEP20_INTEGRATION_TESTING.md
          if git diff --cached --quiet; then
            echo "No Step 20 changes to commit."
          else
            git commit -m "Complete Step 20 integration and Android audit"
            git push
          fi
