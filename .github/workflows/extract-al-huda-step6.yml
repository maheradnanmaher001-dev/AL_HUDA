name: Install AL-HUDA Step 6 Azan Notifications
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Step 6
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -iname 'AL-HUDA_step6_azan_notifications.zip' | head -n1)
          test -n "$ZIP"
          mkdir .step6
          unzip -oq "$ZIP" -d .step6
          cp -R .step6/. .
          rm -rf .step6 "$ZIP"
      - name: Commit Step 6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Add AL-HUDA Step 6 Azan notification foundation" && git push)
