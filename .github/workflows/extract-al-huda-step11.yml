name: Install AL-HUDA Step 11 Bookmarks History
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Step 11
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -iname 'AL-HUDA_step11_bookmarks_history.zip' | head -n1)
          test -n "$ZIP"
          mkdir .step11
          unzip -oq "$ZIP" -d .step11
          cp -R .step11/. .
          rm -rf .step11 "$ZIP"
      - name: Commit Step 11
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Add AL-HUDA Step 11 Bookmarks and History" && git push)
