name: Extract AL-HUDA ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract AL-HUDA ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname 'AL-HUDA_step1_foundation.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "AL-HUDA_step1_foundation.zip was not found."
            exit 1
          fi

          mkdir -p .alhuda_extract
          unzip -o "$ZIP" -d .alhuda_extract

          # Move project files from the ZIP root to the repository root.
          cp -R .alhuda_extract/. .

          rm -rf .alhuda_extract
          rm -f "$ZIP"

          echo "AL-HUDA project extracted successfully."
          echo "Repository root:"
          ls -la

      - name: Commit extracted project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract AL-HUDA Step 1 project"
            git push
          fi
